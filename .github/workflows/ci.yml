name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update the package index
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Check
        run: moon check --deny-warn --target all

      - name: Test (native)
        run: moon test --target native

      - name: Test (wasm)
        run: moon test --target wasm -p maya0513/jedf/src/ast -p maya0513/jedf/src/validate -p maya0513/jedf/src/codec -p maya0513/jedf/src/render_html -p maya0513/jedf/src/render_typst -p maya0513/jedf/src/cli -p maya0513/jedf/src/level -p maya0513/jedf/src/web -p maya0513/jedf/src/container -p maya0513/jedf/src/codec_cbor

      - name: Test (wasm-gc)
        run: moon test --target wasm-gc -p maya0513/jedf/src/ast -p maya0513/jedf/src/validate -p maya0513/jedf/src/codec -p maya0513/jedf/src/render_html -p maya0513/jedf/src/render_typst -p maya0513/jedf/src/cli -p maya0513/jedf/src/level -p maya0513/jedf/src/web -p maya0513/jedf/src/container -p maya0513/jedf/src/codec_cbor

      - name: Coverage
        run: |
          moon coverage clean
          moon test
          moon coverage analyze

      - name: Interface files are up to date
        run: |
          moon info
          git diff --exit-code -- ':(glob)**/pkg.generated.mbti'
