<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>jedf viewer</title>
<style>
  /* The jedf standard style for rendered documents. The HTML
     renderer emits plain semantic elements; this stylesheet is
     what gives them a consistent appearance everywhere. */
  body { font-family: sans-serif; margin: 2em auto; max-width: 44em; padding: 0 1em; line-height: 1.6; color: #1a1a1a; }
  nav { display: flex; gap: 0.5em; align-items: center; margin-bottom: 1em; flex-wrap: wrap; }
  article h1 { font-size: 1.7em; line-height: 1.25; margin: 0.8em 0 0.4em; }
  article h2 { font-size: 1.4em; line-height: 1.3; margin: 0.9em 0 0.4em; }
  article h3 { font-size: 1.2em; line-height: 1.35; margin: 0.9em 0 0.3em; }
  article h4, article h5, article h6 { font-size: 1em; margin: 0.9em 0 0.3em; }
  article p { margin: 0.5em 0; }
  article section { margin: 0.5em 0; }
  article ul, article ol { margin: 0.5em 0; padding-left: 1.6em; }
  article li { margin: 0.2em 0; }
  article a { color: #0645ad; }
  table { border-collapse: collapse; margin: 0.6em 0; }
  th, td { border: 1px solid #999; padding: 0.2em 0.6em; text-align: left; vertical-align: top; }
  th { background: #f0f0f0; }
  .jedf-error { color: #b00; }
  aside.footnote { border-top: 1px solid #999; font-size: 0.9em; margin-top: 1.2em; padding-top: 0.4em; }
  code { background: #eee; padding: 0 0.2em; font-family: ui-monospace, monospace; }
  pre { background: #f6f6f6; padding: 0.6em; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  figure { margin: 0.8em 0; }
  figure img { max-width: 100%; }
  figcaption { font-size: 0.9em; color: #444; margin-top: 0.3em; }
  .math { font-family: serif; font-style: italic; }
  div.math { text-align: center; margin: 0.6em 0; }
  hr.page-break { border: none; border-top: 1px dashed #bbb; margin: 1.2em 0; }
</style>
</head>
<body>
<nav>
  <strong>jedf viewer</strong>
  <button data-example="showcase">showcase</button>
  <button data-example="letter">letter</button>
  <button data-example="meeting-notes">meeting-notes</button>
  <button data-container="showcase">showcase (.jedfc)</button>
  <input type="file" id="file" accept=".jedf,.jedfc,.json">
</nav>
<article id="view"></article>
<script type="module" src="./app.js"></script>
</body>
</html>
